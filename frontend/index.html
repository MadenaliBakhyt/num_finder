<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Company Lookup</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --error: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 16px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 28px 32px;
        width: 100%;
        max-width: 560px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin: 0 0 4px 0;
        font-size: 22px;
      }
      p.subtitle {
        margin: 0 0 20px 0;
        color: var(--muted);
        font-size: 14px;
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: var(--text);
        font-size: 15px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .result {
        border-top: 1px solid #334155;
        padding-top: 16px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .row { display: flex; gap: 10px; }
      .label {
        color: var(--muted);
        min-width: 80px;
      }
      .value a { color: var(--accent); text-decoration: none; }
      .value a:hover { text-decoration: underline; }
      .error { color: var(--error); }
      .hint { color: var(--muted); font-size: 13px; }
      .spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid #475569;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Company Lookup</h1>
      <p class="subtitle">Find a company's official website and phone number.</p>

      <form id="search-form">
        <input
          id="company"
          type="text"
          placeholder="e.g. TOO Ferronordic Kazakhstan"
          autocomplete="off"
          required
        />
        <button type="submit" id="submit">Search</button>
      </form>

      <div id="result" class="result">
        <span class="hint">Enter a company name and press Search.</span>
      </div>
    </div>

    <script>
      const form = document.getElementById("search-form");
      const input = document.getElementById("company");
      const button = document.getElementById("submit");
      const result = document.getElementById("result");

      function render(data) {
        const website = data.website
          ? `<a href="${data.website}" target="_blank" rel="noopener">${data.website}</a>`
          : '<span class="hint">not found</span>';
        const phone = data.phone
          ? data.phone
          : '<span class="hint">not found</span>';
        result.innerHTML = `
          <div class="row"><div class="label">Company</div><div class="value">${escapeHtml(data.company || "")}</div></div>
          <div class="row"><div class="label">Website</div><div class="value">${website}</div></div>
          <div class="row"><div class="label">Phone</div><div class="value">${phone}</div></div>
        `;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const company = input.value.trim();
        if (!company) return;

        button.disabled = true;
        result.innerHTML =
          '<span class="spinner"></span> Searching — this can take 10–30 seconds…';

        try {
          const resp = await fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ company }),
          });

          if (!resp.ok) {
            const msg = await resp.text();
            throw new Error(`HTTP ${resp.status}: ${msg}`);
          }

          const data = await resp.json();
          render(data);
        } catch (err) {
          result.innerHTML =
            '<span class="error">Error: ' + escapeHtml(err.message) + "</span>";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
